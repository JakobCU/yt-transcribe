# transkript::studio — deploy stack
#
# Two ways to use this file (driven by Docker Compose profiles):
#
#   A) NOW, on the Windows GPU box — Postgres in Docker, app + Caddy run NATIVELY
#      (the GPU pipeline can't be containerized on Windows). Start only the DB:
#          docker compose -f deploy/docker-compose.yml up -d
#      (the `app` and `caddy` services have a profile, so they stay stopped.)
#
#   B) SOON, on a Linux GPU server — the whole stack in Docker, GPU passed through
#      via nvidia-container-toolkit:
#          docker compose -f deploy/docker-compose.yml --profile full up -d --build
#
# Config comes from deploy/.env (copy deploy/.env.production.example). NEVER commit it.
name: transkript-studio

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-tcdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to localhost only: the native Windows app connects here; not exposed externally.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tcuser} -d ${POSTGRES_DB:-tcdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- full-stack only (Linux GPU server) -----------------------------------
  app:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tcuser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tcdb}
      COOKIE_SECURE: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/server/media   # persist stored Opus audio across redeploys
    expose:
      - "8000"
    # GPU passthrough — needs nvidia-container-toolkit on the host. Ignored on a CPU host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  caddy:
    profiles: ["full"]
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      TC_DOMAIN: ${TC_DOMAIN}
      TC_TLS_EMAIL: ${TC_TLS_EMAIL}
      TC_UPSTREAM: app        # proxy to the app container, not localhost
      TC_APP_PORT: "8000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
